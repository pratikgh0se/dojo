<text x="352" y="228" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24" fill="#b4bad0">A local-first Mac app for finishing a long study plan.</text>
<text x="352" y="268" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#b4bad0">Today, Board, Do, Designs, Progress. No account. No cloud.</text>
